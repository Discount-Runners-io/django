name: Python Matrix from config file

on:
  workflow_dispatch:
    inputs:
      runner:
        description: Runner label for ubuntu-latest / ubuntu-24.04 jobs
        type: string
        default: ubuntu-latest
      slim_runner:
        description: Runner label for ubuntu-slim jobs
        type: string
        default: ubuntu-slim
      arm_runner:
        description: Runner label for ubuntu-*-arm jobs
        type: string
        default: ubuntu-24.04-arm
      tag:
        description: Benchmark run id, echoed into the run name
        type: string
        default: ''
permissions:
  contents: read

jobs:
  define-matrix:
    runs-on: ${{ startsWith(inputs.runner, 'discountrunners-auto') && format('{0}/key={1}-{2}-{3}', inputs.runner, github.run_id, 'define-matrix', strategy.job-index) || inputs.runner }}
    outputs:
      python_versions_output: ${{ steps.set-matrix.outputs.python_versions }}
    timeout-minutes: 60
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        persist-credentials: false
    - id: set-matrix
      run: |
        python_versions=$(sed -n "s/^.*Programming Language :: Python :: \([[:digit:]]\+\.[[:digit:]]\+\).*$/'\1', /p" pyproject.toml | tr -d '\n' | sed 's/, $//g')
        echo "Supported Python versions: $python_versions"
        echo "python_versions=[$python_versions]" >> "$GITHUB_OUTPUT"
  python:
    runs-on: ${{ startsWith(inputs.runner, 'discountrunners-auto') && format('{0}/key={1}-{2}-{3}', inputs.runner, github.run_id, 'python', strategy.job-index) || inputs.runner }}
    needs: define-matrix
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJson(needs.define-matrix.outputs.python_versions_output) }}
    timeout-minutes: 60
    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        persist-credentials: false
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
        cache-dependency-path: 'tests/requirements/py3.txt'
    - name: Install system packages
      run: |
        sudo apt update
        xargs -a .github/workflows/data/apt-packages.txt sudo apt install -y --no-install-recommends
    - name: Install and upgrade packaging tools
      run: python -m pip install --upgrade pip wheel
    - run: python -m pip install -r tests/requirements/py3.txt -e .
    - name: Run tests
      run: python -Wall tests/runtests.py -v2
run-name: Python Matrix from config file ${{ inputs.tag }} ${{ inputs.runner }}
