name: Tests

on:
  workflow_dispatch:
    inputs:
      runner:
        description: Runner label for ubuntu-latest / ubuntu-24.04 jobs
        type: string
        default: ubuntu-latest
      slim_runner:
        description: Runner label for ubuntu-slim jobs
        type: string
        default: ubuntu-slim
      arm_runner:
        description: Runner label for ubuntu-*-arm jobs
        type: string
        default: ubuntu-24.04-arm
      tag:
        description: Benchmark run id, echoed into the run name
        type: string
        default: ''
permissions:
  contents: read

jobs:
  ubuntu-free-threading:
    runs-on: ${{ startsWith(inputs.runner, 'discountrunners-auto') && format('{0}/key={1}-{2}-{3}', inputs.runner, github.run_id, 'ubuntu-free-threading', strategy.job-index) || inputs.runner }}
    strategy:
      fail-fast: false
      matrix:
        python-version:
        - '3.15t'
    name: Ubuntu, SQLite, Python ${{ matrix.python-version }}
    timeout-minutes: 60
    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        persist-credentials: false
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
        cache-dependency-path: 'tests/requirements/py3-free-threading.txt'
    - name: Install and upgrade packaging tools
      run: python -m pip install --upgrade pip wheel
    - run: python -m pip install -r tests/requirements/py3-free-threading.txt -e .
    - name: Show GIL status
      run: python -c "import sys; print('GIL enabled:', sys._is_gil_enabled())"
    - name: Run tests
      run: python -Wall tests/runtests.py -v2

  javascript-tests:
    runs-on: ${{ startsWith(inputs.runner, 'discountrunners-auto') && format('{0}/key={1}-{2}-{3}', inputs.runner, github.run_id, 'javascript-tests', strategy.job-index) || inputs.runner }}
    name: JavaScript tests
    timeout-minutes: 60
    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        persist-credentials: false
    - name: Set up Node.js
      uses: actions/setup-node@v6
      with:
          # Transitive dependency of puppeteer (extract-zip) broken on 24.16
          # https://github.com/puppeteer/puppeteer/issues/15071
        node-version: '24.15.0'
        cache: 'npm'
        cache-dependency-path: '**/package.json'
    - run: npm install
    - run: npm test

  scripts-tests:
    runs-on: ${{ startsWith(inputs.runner, 'discountrunners-auto') && format('{0}/key={1}-{2}-{3}', inputs.runner, github.run_id, 'scripts-tests', strategy.job-index) || inputs.runner }}
    name: Scripts tests
    timeout-minutes: 60
    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        persist-credentials: false
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.15'
    - run: python -m unittest discover -v -s scripts/
run-name: Tests ${{ inputs.tag }} ${{ inputs.runner }}
